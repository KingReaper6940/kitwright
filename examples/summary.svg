<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">Workshop welcome kits</title><desc id="d">11 planned kits, 4 part types, 2 part types short.</desc><rect width="800" height="330" rx="12" fill="#edf3f4"/><g font-family="system-ui,sans-serif" fill="#243d49"><text x="36" y="48" font-size="15">KITWRIGHT · COMBINED PLAN SNAPSHOT</text><text x="36" y="90" font-size="24">Workshop welcome kits</text><rect x="36" y="122" width="210" height="92" rx="8" fill="#d4e6e9"/><text x="52" y="151" font-size="12">PLANNED KITS</text><text x="52" y="194" font-size="34">11</text><rect x="292" y="122" width="210" height="92" rx="8" fill="#e2e7ed"/><text x="308" y="151" font-size="12">PART TYPES</text><text x="308" y="194" font-size="34">4</text><rect x="548" y="122" width="210" height="92" rx="8" fill="#f0dece"/><text x="564" y="151" font-size="12">TYPES SHORT</text><text x="564" y="194" font-size="34">2</text><text x="36" y="260" font-size="15">Entered plan needs more of the highlighted part types.</text><text x="36" y="296" font-size="12">Manual counts only · no stock changes, physical verification or part-compatibility checks</text></g></svg>